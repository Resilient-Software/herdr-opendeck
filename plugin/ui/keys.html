<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script src="sdpi-components.js"></script>
		<style>
			.help {
				margin: 0;
				color: #969696;
				font-family: "Segoe UI", Arial, Roboto, Helvetica, sans-serif;
				font-size: 9pt;
				line-height: 1.4;
			}
		</style>
	</head>
	<body>
		<sdpi-item label="Keys">
			<sdpi-textfield setting="keys" placeholder="esc"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Send to">
			<sdpi-select
				setting="target"
				label-setting="targetLabel"
				datasource="getWorkspaces"
				hot-reload
				show-refresh
				loading="Loading workspaces…"
			></sdpi-select>
		</sdpi-item>
		<sdpi-item>
			<p class="help">
				Keys separated by commas or spaces: esc, enter, tab, space, backspace, up, down, left, right, f1–f12 or one
				character, each optionally after ctrl+, alt+, meta+ or shift+ (ctrl+c, shift+tab). Sent even at a permission
				prompt.
			</p>
		</sdpi-item>
	</body>
</html>
