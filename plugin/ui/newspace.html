<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			body {
				margin: 0;
				padding: 12px 18px;
				background: transparent;
				color: #d8d8d8;
				font-family: -apple-system, "Segoe UI", sans-serif;
				font-size: 13px;
				-webkit-user-select: none;
			}
			h4 {
				margin: 0 0 6px;
				font-size: 13px;
				color: #b8b8b8;
			}
			p {
				margin: 6px 0 0;
				color: #969696;
			}
		</style>
	</head>
	<body>
		<h4>New Herdr Space</h4>
		<p>Creates a Herdr workspace, focuses it and raises the app hosting Herdr. Dims while Herdr is offline.</p>
		<p>For a tab in an existing workspace, use New Tab.</p>
		<p>This key has no settings.</p>
		<script>
			function connectElgatoStreamDeckSocket(port, propertyInspectorUUID, registerEvent) {
				const websocket = new WebSocket("ws://127.0.0.1:" + port);
				websocket.onopen = () => {
					websocket.send(JSON.stringify({ event: registerEvent, uuid: propertyInspectorUUID }));
				};
			}
		</script>
	</body>
</html>
