name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sh scripts/pack.sh
      - run: gh release create "$GITHUB_REF_NAME" dist/*.streamDeckPlugin --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
